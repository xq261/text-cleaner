<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文本正则清洗</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    textarea { width: 100%; height: 70vh; padding: 10px; box-sizing: border-box; }
    .bar { display:flex; gap:8px; align-items:center; margin: 10px 0; flex-wrap: wrap; }
    button { padding: 8px 10px; }
    label { display:flex; gap:6px; align-items:center; }
    .hint { color:#666; font-size: 12px; }
    @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } textarea{ height: 40vh; } }
  </style>
</head>
<body>
  <h1>文本正则清洗</h1>
  <div class="hint">所有处理在浏览器本地完成，不上传。</div>

  <div class="bar">
    <label><input id="optTrim" type="checkbox" checked> 合并多空格</label>
    <label><input id="optPara" type="checkbox"> 空行保留为段落（双换行）</label>
    <button id="btnCopy">复制输出</button>
    <button id="btnClear">清空</button>
  </div>

  <div class="wrap">
    <div>
      <h3>输入</h3>
      <textarea id="inp" placeholder="在这里粘贴原文..."></textarea>
    </div>
    <div>
      <h3>输出</h3>
      <textarea id="out" readonly placeholder="这里会自动显示处理结果..."></textarea>
    </div>
  </div>

  <script>
    const inp = document.getElementById('inp');
    const out = document.getElementById('out');
    const optTrim = document.getElementById('optTrim');
    const optPara = document.getElementById('optPara');

    function transform(text) {
      // 统一换行（兼容 Windows \r\n）
      let s = text.replace(/\r\n/g, "\n");

      // 1) 去掉断词连字符换行
      s = s.replace(/-\n/g, "");

      if (optPara.checked) {
        // 保留空行作为段落：先把 >=2 个换行标记出来
        s = s.replace(/\n{2,}/g, "\n\n");
        // 单个换行变空格
        s = s.replace(/\n/g, " ");
        // 再把段落标记恢复成双换行（用一个不太可能出现的占位符更稳，这里简单处理）
        // 上面已经把所有 \n 都变空格了，所以此模式需要另一种写法：
        // 更稳方案：先占位，再替换：
      } else {
        // 2) 其余换行变空格
        s = s.replace(/\n/g, " ");
      }

      if (optTrim.checked) {
        // 合并多空格、去首尾空格
        s = s.replace(/[ \t]+/g, " ").trim();
      }
      return s;
    }

    function update() {
      // 若启用“保留段落”，用占位符方式避免被覆盖
      let text = inp.value.replace(/\r\n/g, "\n");
      text = text.replace(/-\n/g, "");

      if (optPara.checked) {
        const token = "__PARA__TOKEN__";
        text = text.replace(/\n{2,}/g, token);
        text = text.replace(/\n/g, " ");
        text = text.replace(new RegExp(token, "g"), "\n\n");
      } else {
        text = text.replace(/\n/g, " ");
      }

      if (optTrim.checked) text = text.replace(/[ \t]+/g, " ").trim();
      out.value = text;
    }

    inp.addEventListener('input', update);
    optTrim.addEventListener('change', update);
    optPara.addEventListener('change', update);

    document.getElementById('btnCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(out.value);
      } catch {
        out.select();
        document.execCommand('copy');
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      inp.value = "";
      out.value = "";
      inp.focus();
    });

    update();
  </script>
</body>
</html>
