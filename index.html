<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文本工具目录</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px 16px;
      color: #222;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p.desc {
      color: #555;
      margin-bottom: 24px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin-bottom: 16px;
    }
    a.tool {
      display: block;
      padding: 16px 18px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid #e5e5e5;
      transition: all 0.15s ease;
    }
    a.tool:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59,130,246,0.15);
      transform: translateY(-1px);
    }
    .tool-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }
    .tool-desc {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>文本工具集</h1>
    <p class="desc">
      一些用于文本整理、小说排版和正则处理的小工具，均在浏览器本地运行。
    </p>

    <ul>
      <li>
        <a class="tool" href="novel-paragraph-handler.html">
          <div class="tool-title">小说段落清洗工具</div>
          <div class="tool-desc">
            去除断词连字符、合并换行、按规则整理段落格式。
          </div>
        </a>
      </li>
    </ul>

    <footer>
      © 2026 · 基于 GitHub Pages · 本地处理不上传
    </footer>
  </div>
</body>
</html>
